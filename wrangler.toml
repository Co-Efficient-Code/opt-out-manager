name = "opt-out-manager"
main = "src/index.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Custom domain routing
routes = [
  { pattern = "optouts.coefficient.org", custom_domain = true }
]

# Non-secret vars go here. Secrets are set via `wrangler secret put`.
[vars]
GOOGLE_HOSTED_DOMAIN = "coefficient.org"
# GOOGLE_CLIENT_ID is public-ish but set as a var for convenience; override per-env if needed.
# GOOGLE_CLIENT_ID = "xxxx.apps.googleusercontent.com"
S3_REGION = "us-east-1"
# S3_BUCKET = "client-bucket-name"

# --- Secrets to set (do NOT commit) ---
# wrangler secret put GOOGLE_CLIENT_ID
# wrangler secret put GOOGLE_CLIENT_SECRET
# wrangler secret put SESSION_SECRET
# wrangler secret put AWS_ACCESS_KEY_ID
# wrangler secret put AWS_SECRET_ACCESS_KEY

# Optional: KV for session storage (uncomment + set id after `wrangler kv namespace create SESSIONS`)
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
