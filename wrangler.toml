name = "opt-out-manager"
main = "src/index.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]
account_id = "b487aa8136a1989c0718b148ecb02522"

# Shared, non-secret vars. Secrets are set via `wrangler secret put --env <env>`.
[vars]
GOOGLE_HOSTED_DOMAIN = "coefficient.org"
S3_REGION = "us-east-2"

# ============================================
# STAGING  ->  staging.optouts.coefficient.org
# deployed from `staging` branch
# ============================================
[env.staging]
name = "opt-out-manager-staging"
routes = [
  { pattern = "staging.optouts.coefficient.org", custom_domain = true }
]

# Project -> (pac, destination) mapping overrides (human-assigned). Survives
# across sessions/runs. Scrubbing/opt-out reads still come from S3 (read-only);
# this KV only holds user-assigned project mappings.
[[env.staging.kv_namespaces]]
binding = "OPTOUT_MAPPING"
id = "c5678d4a97bd41f9b15feedabe68926c"

[env.staging.vars]
GOOGLE_HOSTED_DOMAIN = "coefficient.org"
S3_REGION = "us-east-1"
APP_ENV = "staging"
DRIVE_ROOT_FOLDER = "1E8nIqiFBWzlervF0PNtBuZrGWxdqQ4mF"
DRIVE_FOLDER_BIGDOG = "1SpcxvbNQPOFUFvwJOZoW70F1IzRg07pJ"
DRIVE_FOLDER_CREATIVEDIRECT = "1uBBmWDJRD_bzcwnZHPRmDVmRvBiT0JaR"

# ============================================
# PRODUCTION  ->  optouts.coefficient.org
# deployed from `main` branch
# ============================================
[env.production]
name = "opt-out-manager"
routes = [
  { pattern = "optouts.coefficient.org", custom_domain = true }
]

[env.production.vars]
GOOGLE_HOSTED_DOMAIN = "coefficient.org"
S3_REGION = "us-east-1"
APP_ENV = "production"
DRIVE_ROOT_FOLDER = "1E8nIqiFBWzlervF0PNtBuZrGWxdqQ4mF"
DRIVE_FOLDER_BIGDOG = "1SpcxvbNQPOFUFvwJOZoW70F1IzRg07pJ"
DRIVE_FOLDER_CREATIVEDIRECT = "1uBBmWDJRD_bzcwnZHPRmDVmRvBiT0JaR"

# --- Secrets to set per environment (do NOT commit) ---
# Google auth:
# wrangler secret put GOOGLE_CLIENT_ID           --env staging
# wrangler secret put GOOGLE_CLIENT_SECRET       --env staging
# wrangler secret put SESSION_SECRET             --env staging
# S3 sync (each value is JSON: {"bucket":"...","accessKeyId":"...","secretAccessKey":"...","region":"us-east-1"}):
# wrangler secret put S3_SOURCE_P2P              --env staging   # datadash-p2p (PULL)
# wrangler secret put S3_DEST_BIGDOG             --env staging   # datadash-bigdogstrategies (PUSH)
# wrangler secret put S3_DEST_CREATIVEDIRECT     --env staging   # datadash-creativedirect (PUSH)
# (repeat with --env production)
