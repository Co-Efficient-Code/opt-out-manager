name: Deploy Opt-Out Manager

on:
  # Auto-deploy: staging branch -> staging, main -> production
  push:
    branches:
      - staging
      - main

  # Manual trigger for rollbacks or specific commits
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        required: true
        default: 'staging'
        options:
          - staging
          - production
      action:
        description: 'What to do?'
        type: choice
        default: 'deploy'
        options:
          - deploy
          - rollback
      commit_hash:
        description: 'Commit hash (required for rollback, optional for deploy)'
        type: string
        required: false

jobs:
  # ============================================
  # PREPARE - Determine environment and SHA
  # ============================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.set-sha.outputs.sha }}
      environment: ${{ steps.set-env.outputs.environment }}
      app_url: ${{ steps.set-env.outputs.app_url }}
      wrangler_env: ${{ steps.set-env.outputs.wrangler_env }}

    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            if [ "${{ github.ref_name }}" == "main" ]; then
              ENV="production"
            else
              ENV="staging"
            fi
          else
            ENV="${{ inputs.environment }}"
          fi

          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "wrangler_env=${ENV}" >> $GITHUB_OUTPUT

          if [ "$ENV" == "production" ]; then
            echo "app_url=https://optouts.coefficient.org" >> $GITHUB_OUTPUT
            echo "🚀 Target: PRODUCTION"
          else
            echo "app_url=https://staging.optouts.coefficient.org" >> $GITHUB_OUTPUT
            echo "🧪 Target: STAGING"
          fi

      - name: Determine deploy SHA
        id: set-sha
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.action }}" == "rollback" ] && [ -n "${{ inputs.commit_hash }}" ]; then
            echo "sha=${{ inputs.commit_hash }}" >> $GITHUB_OUTPUT
            echo "🔄 Rollback to: ${{ inputs.commit_hash }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.commit_hash }}" ]; then
            echo "sha=${{ inputs.commit_hash }}" >> $GITHUB_OUTPUT
            echo "📌 Deploy specific commit: ${{ inputs.commit_hash }}"
          else
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "🚀 Deploy HEAD: ${{ github.sha }}"
          fi

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ steps.set-env.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ steps.set-sha.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ inputs.action || 'deploy' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} (${{ github.ref_name }}) |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # DEPLOY - Cloudflare Worker
  # ============================================
  deploy-worker:
    runs-on: ubuntu-latest
    needs: prepare
    name: Deploy Worker (${{ needs.prepare.outputs.environment }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.deploy_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.65.0'
          command: deploy --env ${{ needs.prepare.outputs.wrangler_env }}

      - name: Health check
        run: |
          sleep 8
          curl -f ${{ needs.prepare.outputs.app_url }}/health || exit 1
          echo "✅ Worker healthy at ${{ needs.prepare.outputs.app_url }}"

  # ============================================
  # SUMMARY
  # ============================================
  deployment-summary:
    runs-on: ubuntu-latest
    needs: [prepare, deploy-worker]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ needs.prepare.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | ${{ needs.deploy-worker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ needs.prepare.outputs.deploy_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### URL" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ needs.prepare.outputs.app_url }}" >> $GITHUB_STEP_SUMMARY
