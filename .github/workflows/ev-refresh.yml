name: Early-Vote Cache Refresh

# Daily pull of each configured state's already-voted universe from L2 into R2,
# so the Scrub a list tool reads the cache instead of hitting L2 live (one L2
# pull/day, well under the rate limit; scrubs never touch L2).
#
# All the real work (L2 block discovery, statuses, export, R2 write) happens in
# the Worker's token-guarded /cron/ev-refresh endpoint. This job is just a clock.

on:
  schedule:
    # Daily at 08:00 UTC (~3am CDT). Early morning: EV counts are stable overnight
    # and L2 is quiet. GitHub cron is UTC-only and best-effort (can lag minutes).
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to refresh'
        type: choice
        required: true
        default: 'staging'
        options:
          - staging
          - production

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger early-vote refresh
        env:
          STAGING_URL: ${{ secrets.OPTOUT_STAGING_URL }}
          STAGING_CRON_SECRET: ${{ secrets.OPTOUT_STAGING_CRON_SECRET }}
          PROD_URL: ${{ secrets.OPTOUT_PROD_URL }}
          PROD_CRON_SECRET: ${{ secrets.OPTOUT_PROD_CRON_SECRET }}
          # Scheduled runs refresh BOTH envs is overkill; default to production
          # for the nightly clock, staging via manual dispatch.
          TARGET: ${{ github.event.inputs.target || 'production' }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            URL="$PROD_URL"; SECRET="$PROD_CRON_SECRET"
          else
            URL="$STAGING_URL"; SECRET="$STAGING_CRON_SECRET"
          fi
          if [ -z "${URL:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "Missing URL or CRON secret for target=$TARGET"; exit 1
          fi
          echo "Early-vote refresh ($TARGET) at $(date -u) ..."
          # Pull ONE STATE PER REQUEST in a loop. Each state is a small, bounded
          # request (well under any Worker/request timeout); a single state
          # failing does NOT abort the rest. Much more robust than one big
          # all-states call that can time out partway and leave gaps.

          # Get the configured state list from the Worker (stays in sync with
          # EV_STATES config; no hardcoding here).
          STATES_JSON=$(curl -sS -m 30 "$URL/cron/ev-states" -H "Authorization: Bearer $SECRET")
          STATES=$(printf '%s' "$STATES_JSON" | python3 -c 'import sys,json; print(" ".join(json.load(sys.stdin).get("states",[])))')
          if [ -z "${STATES:-}" ]; then
            echo "Could not get state list: $STATES_JSON"; exit 1
          fi
          echo "States: $STATES"

          FAILED=""
          for ST in $STATES; do
            echo "--- $ST ---"
            # Per-state timeout: block discovery + export poll. 10 min is plenty.
            HTTP=$(curl -sS -m 600 -o /tmp/resp.json -w '%{http_code}' \
              -X POST "$URL/cron/ev-refresh?states=$ST" \
              -H "Authorization: Bearer $SECRET" || echo 000)
            echo "  HTTP $HTTP"
            cat /tmp/resp.json 2>/dev/null; echo
            # Count it as failed if non-2xx OR the body reports a failed state.
            if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
              FAILED="$FAILED $ST(http=$HTTP)"
            elif printf '%s' "$(cat /tmp/resp.json)" | grep -q '"failed":\[{'; then
              FAILED="$FAILED $ST(reported)"
            fi
          done

          echo "============================="
          # Send ONE summary email to Jacob (notify-only, no re-pull) reflecting the
          # final cache state after the loop.
          echo "--- summary email ---"
          curl -sS -m 60 -X POST "$URL/cron/ev-refresh?states=none&email=1" \
            -H "Authorization: Bearer $SECRET"; echo

          if [ -n "$FAILED" ]; then
            echo "FAILED states:$FAILED"
            exit 1
          fi
          echo "All states refreshed OK."
